openapi: 3.0.3
info:
  title: LinkShrink API
  version: 0.1.0
  description: URL shortener. Create a short link, then follow it to be redirected.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            text/plain:
              schema:
                type: string
                example: LinkShrink is alive
  /links:
    post:
      summary: Create a short link
      operationId: createLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
      responses:
        "201":
          description: Link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "400":
          description: Malformed JSON (code invalid_json)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body larger than 1 MB (code body_too_large)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: URL is not a valid http or https URL (code invalid_url)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error (code internal_error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Wrong HTTP method for this path (code method_not_allowed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /{code}:
    get:
      summary: Follow a short link
      description: Redirects to the original URL. The "Try it out" button can't show this
        properly, because the browser follows the redirect itself. Use curl -i instead.
      operationId: redirect
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: XzsS28
      responses:
        "302":
          description: Redirect to the original URL
          headers:
            Location:
              schema:
                type: string
                example: https://example.com
        "404":
          description: Unknown short code (code not_found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error (code internal_error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /docs/run:
    post:
      tags: [Dev tools]
      summary: "Dev only: run any request against this API, like curl -i"
      description: Not part of the real API. Sends the request you describe through the full
        server (router and middleware) and returns the raw response. The status line,
        headers and body are shown in the response body below.
      operationId: devRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: The raw response of the request you described
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid runner input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    CreateRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          example: https://example.com
    Link:
      type: object
      properties:
        short_code:
          type: string
          example: XzsS28
        long_url:
          type: string
          example: https://example.com
        created_at:
          type: string
          format: date-time
    RunRequest:
      type: object
      required: [method, path]
      properties:
        method:
          type: string
          example: DELETE
        path:
          type: string
          example: /links
        body:
          type: string
          description: Optional request body, as a string.
          example: ""
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            status:
              type: integer
              example: 422
            code:
              type: string
              example: invalid_url
            message:
              type: string
              example: url must be a valid http or https URL
            request_id:
              type: string
              example: 9f86d081884c7d65